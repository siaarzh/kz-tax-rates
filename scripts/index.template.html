<body>
<h1 id="title"></h1>
<p class="muted">Ставка налога при специальном налоговом режиме на основе упрощённой декларации («упрощёнка»), с привязкой к коду КАТО. В каждой строке стоит ссылка на решение маслихата, из которого взята ставка.</p>
<p class="muted" id="baseline"></p>

<div class="search">
  <label for="q" class="muted">Поиск по коду КАТО или названию района</label>
  <input id="q" type="search" autocomplete="off" placeholder="750000000 или Алматы" aria-describedby="count">
</div>
<p class="muted" id="count" role="status"></p>

<p class="muted" id="files"></p>
<details class="notice" id="notice"></details>
<details class="coverage" id="coverage"></details>

<div class="results" id="results"></div>

<footer id="footer"></footer>

<script type="application/json" id="payload">/*DATA*/</script>
<script type="application/json" id="aliases">/*ALIASES*/</script>
<script type="application/json" id="view">/*VIEW*/</script>
<script>/*MINISEARCH*/</script>
<script>
(function () {
  "use strict";
  var payload = JSON.parse(document.getElementById("payload").textContent);
  var aliasRows = JSON.parse(document.getElementById("aliases").textContent);
  // Which years there are, which one is current, and whether a future column
  // needs qualifying are all decided by the build, not here. See page_view() in
  // scripts/build.py.
  var view = JSON.parse(document.getElementById("view").textContent);
  var years = Object.keys(payload.years).sort().reverse();
  // Left to right on the page, oldest first. `years` stays newest-first because
  // the coverage line and the payload lookups below already read it that way.
  var yearsAsc = view.years;
  // The feature turns itself on with the data and is invisible until then.
  var multi = yearsAsc.length > 1;
  var currentYear = view.current_year;

  // One entry per district, holding every year we have for it. With one year in
  // the payload this is exactly the old one-entry-per-row list, in the same
  // order, which is what keeps the single-year page unchanged.
  var rows = [];
  var byKato = {};
  years.forEach(function (year) {
    payload.years[year].rates.forEach(function (rate) {
      var entry = byKato[rate.kato];
      if (!entry) {
        // Names come from the newest year that has the district, because that
        // is the newest reading of what the place is called.
        entry = { kato: rate.kato, base: payload.years[year].base_rate, r: rate, years: {}, bases: {} };
        byKato[rate.kato] = entry;
        rows.push(entry);
      }
      entry.years[year] = rate;
      entry.bases[year] = payload.years[year].base_rate;
    });
  });
  var total = rows.length;

  // The rate is stored as a fraction and shown as a percentage. Multiplying
  // floats gives 3.0000000000000004, so round to two decimals and trim. No
  // space before the sign: Kazakh accounting writes it closed up.
  function number(fraction) {
    return String(Math.round(fraction * 10000) / 100).replace(".", ",");
  }
  function percent(fraction) { return number(fraction) + "%"; }

  function text(tag, value, className) {
    var node = document.createElement(tag);
    node.textContent = value;
    if (className) { node.className = className; }
    return node;
  }

  function plural(n, forms) {
    var mod100 = n % 100;
    var mod10 = n % 10;
    if (mod100 >= 11 && mod100 <= 14) { return forms[2]; }
    if (mod10 === 1) { return forms[0]; }
    if (mod10 >= 2 && mod10 <= 4) { return forms[1]; }
    return forms[2];
  }

  // Kazakh letters are folded to their nearest Russian shape on BOTH sides of
  // the comparison. That is what lets «Конаев», typed on a Russian keyboard,
  // reach «Қонаев».
  var FOLD = { "ә": "а", "ғ": "г", "қ": "к", "ң": "н", "ө": "о", "ұ": "у", "ү": "у", "һ": "х", "і": "и", "ё": "е" };
  function fold(value) {
    return String(value).toLowerCase().replace(/[әғқңөұүһіё]/g, function (c) { return FOLD[c]; });
  }

  // The current year's base rate where we have that year, otherwise the newest
  // year's. Read from the payload either way; this page states no rate it was
  // not given.
  var base = payload.years[currentYear]
    ? payload.years[currentYear].base_rate
    : (rows.length ? rows[0].base : null);

  if (multi) {
    document.body.className = "multi-year";
    document.title = "Ставка налога по упрощённой декларации (упрощёнка) по районам Казахстана, " +
      yearsAsc.join(" · ") + " · КАТО";
  }

  document.getElementById("title").textContent =
    "Ставка налога по упрощённой декларации: районы и города" +
    (yearsAsc.length ? ", " + yearsAsc.join(" · ") : "");

  // The base rate is read out of the payload, never typed here. It is a rate,
  // and this page states no rate it was not given.
  if (base) {
    document.getElementById("baseline").textContent =
      "Общеустановленная ставка составляет " + percent(base) +
      ". Маслихат вправе понизить её не более чем на 50 %, поэтому по районам она отличается.";
  }

  // Relative links, built here rather than written into the template, so the
  // page carries no static href to anything outside itself.
  var files = document.getElementById("files");
  files.appendChild(document.createTextNode("Данные: "));
  var json = document.createElement("a");
  json.href = "rates.json";
  json.textContent = "JSON";
  files.appendChild(json);
  files.appendChild(document.createTextNode(" · "));
  var csv = document.createElement("a");
  csv.href = "../data/rates.csv";
  csv.textContent = "CSV";
  files.appendChild(csv);

  // Read from the payload, never written into this template: the page and the
  // JSON must not be able to state different terms. The lead-in is stripped by
  // exact string match so the heading is not repeated inside the body.
  var LEAD = "Не является налоговой консультацией. ";
  var licence = "Лицензия " + payload.licence + " распространяется на этот набор данных и на скрипты. " +
    "Сами решения маслихатов ею не покрываются: официальные документы не являются объектами авторского права.";

  var notice = document.getElementById("notice");
  var noticeSummary = document.createElement("summary");
  noticeSummary.appendChild(text("strong", "Не является налоговой консультацией."));
  notice.appendChild(noticeSummary);
  notice.appendChild(text("p", payload.not_tax_advice_ru.replace(LEAD, "")));
  notice.appendChild(text("p", licence));

  var coverageWarning = total === 0
    ? "Каждую ставку вносит человек, который прочитал решение маслихата. Пустая таблица честнее, чем заполненная наугад."
    : "Если района нет в таблице, это не значит, что там действует базовая ставка " + percent(base) +
      ". Это значит только одно: его решение ещё никто не прочитал. Маслихат мог ставку понизить, поэтому проверьте решение сами.";
  var coverageHead = total === 0
    ? "В таблице пока нет ни одной ставки."
    : "Таблица неполная: " + total + " из примерно " +
      payload.years[years[0]].coverage.estimated_total + " районов и городов.";

  var coverage = document.getElementById("coverage");
  var coverageSummary = document.createElement("summary");
  coverageSummary.appendChild(text("strong", coverageHead));
  coverage.appendChild(coverageSummary);
  coverage.appendChild(text("p", coverageWarning));

  // A future year's rate is not the same kind of fact as this year's, and the
  // page says so while a future column is on screen. The sentence itself comes
  // from the build; the page states no claim it was not given.
  if (view.future_note_ru) {
    // Created rather than filled in, so the one-year page carries no element
    // for it at all: the dormant page must be the page it is today, node for
    // node, not that page plus an empty hidden one.
    var slot = document.getElementById("results");
    slot.parentNode.insertBefore(text("p", view.future_note_ru, "muted future-note"), slot);
  }

  // Both notices again, in full, at the foot of the page. Findable twice, and a
  // wall of text in neither place.
  var footer = document.getElementById("footer");
  footer.appendChild(text("p", payload.not_tax_advice_ru));
  footer.appendChild(text("p", licence));
  footer.appendChild(text("p", coverageWarning));

  // adilet serves one document at two URLs, one per language. The Kazakh one is
  // the stored Russian URL with /rus/ swapped for /kaz/. A URL that does not
  // match that shape yields null and the row shows the Russian link alone: a
  // plausible link that 404s is worse than no link at all.
  function kazakhUrl(url) {
    return /\/rus\//.test(url) ? url.replace("/rus/", "/kaz/") : null;
  }

  function ruDate(stamp) {
    var m = String(stamp).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + "." + m[2] + "." + m[1] : String(stamp);
  }

  // A faint tint per distinct rate, paired with the number itself. The colour
  // is never the only carrier of the value.
  var tints = {};
  var everyRate = [];
  years.forEach(function (year) {
    payload.years[year].rates.forEach(function (rate) { everyRate.push(rate.rate); });
  });
  everyRate
    .filter(function (rate, i, all) { return all.indexOf(rate) === i; })
    .sort(function (a, b) { return a - b; })
    .forEach(function (rate, i) { tints[rate] = i % 4; });

  var index = null;
  if (typeof MiniSearch === "function") {
    index = new MiniSearch({
      fields: ["text"],
      storeFields: ["kind", "idx"],
      processTerm: function (term) { return fold(term); }
    });
    index.addAll(rows.map(function (row, i) {
      return {
        id: "r" + i,
        kind: "rate",
        idx: i,
        text: [row.r.kato, row.r.name_ru, row.r.name_kk, row.r.oblast_ru, row.r.oblast_kk].join(" ")
      };
    }));
    index.addAll(aliasRows.map(function (alias, i) {
      return { id: "a" + i, kind: "alias", idx: i, text: [alias[0], alias[1], alias[2]].join(" ") };
    }));
  }

  // A word typed in the nominative must still reach the same word declined, and
  // «алматы» must reach «Алматинская область». Neither is a shared term, only a
  // shared prefix, so the query runs a second time truncated.
  function stem(query) {
    return query.split(/\s+/).map(function (token) {
      return token.length > 5 ? token.slice(0, Math.max(5, token.length - 3)) : token;
    }).join(" ");
  }

  function lookup(query) {
    var hits = [];
    var seen = {};
    if (!index) { return hits; }
    // Fuzziness on the typed query catches a typo. The truncated query is run
    // without it: truncating already loosens the match, and loosening a loose
    // query twice turned «Конаев» into a page of villages called Конай.
    //
    // A КАТО code is never fuzzy. One digit out is a different district, so a
    // near miss on 790000000 is not a helpful guess, it is a wrong answer. This
    // is also what keeps a permalink landing on one row.
    var digits = /^\d+$/.test(query.trim());
    var options = digits
      ? { prefix: true, combineWith: "AND" }
      : { prefix: true, fuzzy: 0.2, combineWith: "AND" };
    var queries = [[query, options]];
    var truncated = stem(query);
    if (truncated !== query) { queries.push([truncated, { prefix: true, combineWith: "AND" }]); }
    queries.forEach(function (candidate) {
      index.search(candidate[0], candidate[1]).forEach(function (hit) {
        if (seen[hit.id]) { return; }
        seen[hit.id] = true;
        hits.push(hit);
      });
    });
    return hits;
  }

  var results = document.getElementById("results");
  var count = document.getElementById("count");

  function rateCell(row) {
    var cell = document.createElement("td");
    cell.className = "rate";
    var value = text("span", percent(row.r.rate), "value");
    if (tints[row.r.rate]) { value.className = "value t" + tints[row.r.rate]; }
    cell.appendChild(value);
    // Marks the exception, not the rule: a district that did not lower the rate
    // at all. No row qualifies today. The day one does, it is labelled.
    if (row.r.rate === row.base) { cell.appendChild(text("span", "= база", "base")); }
    return cell;
  }

  function placeCell(row) {
    var place = document.createElement("td");
    place.className = "place";
    place.appendChild(text("div", row.r.name_ru));
    var kk = text("div", row.r.name_kk, "kk");
    kk.setAttribute("lang", "kk");
    place.appendChild(kk);
    place.appendChild(text("div", row.r.kato, "kato"));
    return place;
  }

  function rowNode(row) {
    var tr = document.createElement("tr");
    tr.className = "row";
    tr.id = "k" + row.r.kato;
    tr.appendChild(rateCell(row));
    tr.appendChild(placeCell(row));
    tr.appendChild(decisionCell(row.r, "td"));
    return tr;
  }

  function whenClass(year) {
    if (year === currentYear) { return "cur"; }
    return year > currentYear ? "future" : "past";
  }

  // One year of one district: its rate, whether that rate is the base one, and
  // its own citation, because each year is a different decision.
  function yearCell(row, year) {
    var cell = document.createElement("td");
    cell.className = "rate yr " + whenClass(year);
    cell.appendChild(text("span", year, "ylabel"));

    var rate = row.years[year];
    // No decision read for this district and year. The base rate is not the
    // answer to that, and neither is a blank cell that reads as one.
    if (!rate) {
      var missing = text("span", "нет данных", "nodata");
      missing.title = "Решение за " + year + " год по этому району ещё не прочитано";
      cell.appendChild(missing);
      return cell;
    }

    var value = text("span", percent(rate.rate), "value");
    if (tints[rate.rate]) { value.className = "value t" + tints[rate.rate]; }
    cell.appendChild(value);
    if (rate.rate === row.bases[year]) { cell.appendChild(text("span", "= база", "base")); }
    cell.appendChild(decisionCell(rate, "div"));
    return cell;
  }

  function multiRowNode(row) {
    var tr = document.createElement("tr");
    tr.className = "mrow";
    tr.id = "k" + row.r.kato;
    tr.appendChild(placeCell(row));
    yearsAsc.forEach(function (year) { tr.appendChild(yearCell(row, year)); });
    return tr;
  }

  function bodyRow(row) { return multi ? multiRowNode(row) : rowNode(row); }

  // Both links open in a new tab, so following a citation does not cost a
  // reader their place in a long table.
  function decisionCell(rate, tag) {
    var cell = document.createElement(tag);
    cell.className = "decision";
    var link = document.createElement("a");
    link.href = rate.source_url;
    link.textContent = rate.decision_ref;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    cell.appendChild(link);

    var kaz = kazakhUrl(rate.source_url);
    if (kaz) {
      cell.appendChild(document.createTextNode(" "));
      var kazLink = document.createElement("a");
      kazLink.href = kaz;
      kazLink.textContent = "(каз.)";
      kazLink.title = "Текст решения на казахском языке";
      kazLink.setAttribute("lang", "kk");
      kazLink.target = "_blank";
      kazLink.rel = "noopener noreferrer";
      cell.appendChild(kazLink);
    }
    return cell;
  }

  function headRow() {
    var head = document.createElement("thead");
    var tr = document.createElement("tr");
    if (!multi) {
      ["Ставка", "Район или город", "Решение"].forEach(function (title) {
        tr.appendChild(text("th", title));
      });
      head.appendChild(tr);
      return head;
    }
    tr.appendChild(text("th", "Район или город", "place-head"));
    yearsAsc.forEach(function (year) {
      var th = text("th", year, "yr " + whenClass(year));
      if (year === currentYear) { th.appendChild(text("span", "текущий", "cur-tag")); }
      tr.appendChild(th);
    });
    head.appendChild(tr);
    return head;
  }

  // Display order only. data/rates.csv and dist/rates.json keep sorting by
  // КАТО, so no consumer's diff churns.
  //
  // Both tiers are derived from what the classifier already says, never from a
  // list of codes typed here. A city of republican significance is an oblast
  // level code (two digits, then seven zeros) whose Russian name starts «г.».
  // A city of oblast significance carries «Г.А.», городская администрация, in
  // its own name. Astana is absent from the dataset today; when its decision
  // parses it lands at 710000000 and sorts first with no change here.
  function tier(rate) {
    if (/^\d\d0000000$/.test(rate.kato) && /^г\./.test(rate.name_ru)) { return 0; }
    if (/Г\.А\.$/.test(rate.name_ru)) { return 1; }
    return 2;
  }

  function byTierThenKato(a, b) {
    return (tier(a.r) - tier(b.r)) || (a.r.kato < b.r.kato ? -1 : 1);
  }

  var CITIES = ["город", "города", "городов"];
  var DISTRICTS = ["район", "района", "районов"];

  // The band a group is summarised by is the current year's, so the headline
  // number is the one the reader is here for. Where no member has the current
  // year, every year we do hold is used rather than none.
  function bandRates(members) {
    if (!multi) { return members.map(function (row) { return row.r.rate; }); }
    var rates = [];
    members.forEach(function (row) {
      if (row.years[currentYear]) { rates.push(row.years[currentYear].rate); }
    });
    if (rates.length) { return rates; }
    members.forEach(function (row) {
      yearsAsc.forEach(function (year) {
        if (row.years[year]) { rates.push(row.years[year].rate); }
      });
    });
    return rates;
  }

  function groupRow(label, members, forms) {
    var rates = bandRates(members);
    var low = Math.min.apply(null, rates);
    var high = Math.max.apply(null, rates);
    var band = low === high ? percent(low) : "от " + percent(low) + " до " + percent(high);
    var tr = document.createElement("tr");
    tr.className = "group";
    var th = text("th", label + " · " + members.length + " " +
      plural(members.length, forms) + " · " + band);
    th.setAttribute("colspan", multi ? String(1 + yearsAsc.length) : "3");
    tr.appendChild(th);
    return tr;
  }

  function table(found, grouped) {
    var node = document.createElement("table");
    if (multi) { node.className = "multi"; }
    node.appendChild(headRow());
    var body = document.createElement("tbody");
    if (!grouped) {
      found.forEach(function (row) { body.appendChild(bodyRow(row)); });
      node.appendChild(body);
      return node;
    }

    // Астана, Алматы and Шымкент sit above the oblasts rather than at the
    // bottom of the code order, where nobody looking for the capital would
    // scroll to find them.
    var capitals = found.filter(function (row) { return tier(row.r) === 0; }).sort(byTierThenKato);
    if (capitals.length) {
      body.appendChild(groupRow("Города республиканского значения", capitals, CITIES));
      capitals.forEach(function (row) { body.appendChild(bodyRow(row)); });
    }

    var order = [];
    var groups = {};
    found.filter(function (row) { return tier(row.r) !== 0; }).forEach(function (row) {
      var key = row.r.oblast_ru || "";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(row);
    });
    order.forEach(function (key) {
      var members = groups[key].sort(byTierThenKato);
      if (key) { body.appendChild(groupRow(key, members, DISTRICTS)); }
      members.forEach(function (row) { body.appendChild(bodyRow(row)); });
    });
    node.appendChild(body);
    return node;
  }

  // An alias has no decision of its own, so it is never drawn as a row. It is
  // drawn as a sentence naming the jurisdiction whose decision covers it.
  function aliasNode(alias, target) {
    var node = document.createElement("div");
    node.className = "alias";
    // «Қонаев Г.А.» already ends in a full stop, and «Г.А.. Действует» is how a
    // generated sentence announces that nobody read it.
    var name = target.r.name_ru;
    var stop = name.slice(-1) === "." ? "" : ".";
    // With several years the sentence has to say which year it is quoting, and
    // it quotes the current one wherever we hold it.
    var shown = multi ? (target.years[currentYear] || null) : target.r;
    var shownYear = multi && shown ? currentYear : null;
    if (multi && !shown) {
      for (var y = yearsAsc.length - 1; y >= 0 && !shown; y -= 1) {
        if (target.years[yearsAsc[y]]) { shown = target.years[yearsAsc[y]]; shownYear = yearsAsc[y]; }
      }
    }
    node.appendChild(text(
      "p",
      alias[1] + " входит в " + name + stop + " Действует ставка " +
      name + (shownYear ? " на " + shownYear + " год" : "") + ": " + percent(shown.rate) + "."
    ));
    var kk = text("span", alias[2], "kk");
    kk.setAttribute("lang", "kk");
    node.appendChild(kk);
    node.appendChild(text("span", alias[0] + " → " + target.r.kato, "kato"));
    node.appendChild(decisionCell(shown, "div"));
    return node;
  }

  var ALIAS_SHOWN = 12;

  function render(query) {
    var needle = query.trim();
    results.textContent = "";

    if (total === 0) {
      count.textContent = "";
      return;
    }

    if (!needle) {
      count.textContent = "Всего: " + total;
      results.appendChild(table(rows, true));
      return;
    }

    var found = [];
    var picked = {};
    var exact = [];
    var near = [];
    lookup(needle).forEach(function (hit) {
      if (hit.kind === "rate") {
        var row = rows[hit.idx];
        if (!picked[row.r.kato]) { picked[row.r.kato] = true; found.push(row); }
        return;
      }
      var alias = aliasRows[hit.idx];
      var target = byKato[alias[3]];
      // No target row means no rate to state, and stating one anyway is exactly
      // the failure this project exists to prevent. The alias is dropped: its
      // jurisdiction has not been read, so the page has nothing to say about it.
      if (!target) { return; }
      var name = fold(alias[1]) + " " + fold(alias[2]);
      (name.indexOf(fold(needle)) >= 0 ? exact : near).push([alias, target]);
    });

    // Fuzziness earns its keep on a typo and not otherwise. «алматы» is one
    // letter from «Алмалы», and eleven villages called Алмалы standing above
    // the city is a worse answer than none of them. So a near miss is only
    // drawn when nothing matched outright.
    var aliasHits = (exact.length ? exact : near).slice(0, ALIAS_SHOWN);
    aliasHits.forEach(function (pair) {
      var target = pair[1];
      if (!picked[target.r.kato]) { picked[target.r.kato] = true; found.push(target); }
    });

    count.textContent = "Найдено: " + found.length;
    aliasHits.forEach(function (pair) { results.appendChild(aliasNode(pair[0], pair[1])); });

    if (found.length === 0 && aliasHits.length === 0) {
      results.appendChild(text("p", "Ничего не найдено. Возможно, решение по этому району ещё не внесено или в запросе опечатка.", "empty"));
      return;
    }
    if (found.length) { results.appendChild(table(found, false)); }
  }

  var input = document.getElementById("q");
  input.addEventListener("input", function () { render(input.value); });

  // A per-district permalink (#k750000000) opens the page already filtered to
  // that district, so a shared link lands on the row rather than near it.
  var hash = decodeURIComponent(location.hash.replace(/^#k?/, ""));
  if (hash) { input.value = hash; }
  render(input.value);

  document.getElementById("footer").appendChild(text(
    "p",
    "Обновлено: " + ruDate(payload.generated_at) +
    (payload.kato_version ? " · редакция КАТО: " + payload.kato_version.replace("NK RK", "НК РК") : "") +
    " · версия схемы: " + payload.schema_version
  ));
}());
</script>
</body>
</html>
