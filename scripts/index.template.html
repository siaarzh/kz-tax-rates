<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ставки упрощённого режима по районам · КАТО</title>
<!--
  Generated by scripts/build.py. Do not edit dist/index.html — edit this template.

  One file, no framework, no request to anything. The dataset is inlined below,
  so the page works from file://, from Pages, and from a copy on a laptop with
  no network. There is nothing to load and nothing to fail.

  It never claims to be complete. The coverage line states the count against an
  estimate and says so in words, because a partial table that looks finished is
  this project's worst failure mode.
-->
<style>
  :root { color-scheme: light dark; --fg: #16181d; --bg: #fff; --muted: #5b6270; --line: #d9dde5; --accent: #0a58ca; --warn-bg: #fff6e5; --warn-line: #e0b34d; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e8ec; --bg: #14161a; --muted: #9aa1ae; --line: #2c313a; --accent: #7aa7ff; --warn-bg: #2a2313; --warn-line: #6b5320; } }
  * { box-sizing: border-box; }
  body { margin: 0 auto; padding: 1.5rem 1rem 4rem; max-width: 54rem; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p { margin: .4rem 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  .coverage { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: .4rem; padding: .7rem .9rem; margin: 1rem 0; }
  input { width: 100%; padding: .7rem .8rem; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: .4rem; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  caption { text-align: left; padding-bottom: .4rem; }
  th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  td.rate { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  td.rate .muted { font-weight: 400; }
  td.kato { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  a { color: var(--accent); }
  .empty { padding: 1.2rem 0; }
  .notice { border-left: 3px solid var(--line); padding: .1rem 0 .1rem .8rem; margin: 1rem 0; color: var(--muted); font-size: .9rem; }
  .notice strong { color: var(--fg); }
</style>
</head>
<body>
<h1>Ставка упрощённого режима по районам</h1>
<p class="muted">Ставка налога для специального налогового режима на основе упрощённой декларации, по коду КАТО. Каждая строка ссылается на решение маслихата, из которого она прочитана.</p>

<div class="notice" id="notice"></div>

<div class="coverage" id="coverage"></div>

<label for="q" class="muted">Поиск по коду КАТО или названию района</label>
<input id="q" type="search" autocomplete="off" placeholder="750000000 или Алматы" aria-describedby="count">
<p class="muted" id="count" role="status"></p>

<div id="results"></div>

<p class="muted" id="meta"></p>

<script type="application/json" id="payload">/*DATA*/</script>
<script>
(function () {
  "use strict";
  var payload = JSON.parse(document.getElementById("payload").textContent);
  var years = Object.keys(payload.years).sort().reverse();
  var rows = [];
  years.forEach(function (year) {
    payload.years[year].rates.forEach(function (rate) {
      rows.push({ year: year, base: payload.years[year].base_rate, r: rate });
    });
  });

  // The rate is stored as a fraction and shown as a percentage. Multiplying
  // floats gives 3.0000000000000004, so round to two decimals and trim.
  function percent(fraction) {
    return String(Math.round(fraction * 10000) / 100).replace(".", ",") + " %";
  }

  function text(tag, value, className) {
    var node = document.createElement(tag);
    node.textContent = value;
    if (className) { node.className = className; }
    return node;
  }

  // Read from the payload, never written into this template: the page and the
  // JSON must not be able to state different terms.
  var notice = document.getElementById("notice");
  notice.appendChild(text("strong", "Не является налоговой консультацией."));
  notice.appendChild(text("p", payload.not_tax_advice_ru.replace("Не является налоговой консультацией. ", "")));
  notice.appendChild(text("p", "Лицензия: " + payload.licence + ". Она распространяется на эту подборку и на скрипты, но не на сами решения маслихатов — правовой акт не является объектом авторского права."));

  var coverage = document.getElementById("coverage");
  var total = rows.length;
  if (total === 0) {
    coverage.appendChild(text("strong", "В таблице пока нет ни одной ставки."));
    coverage.appendChild(text("p", "Каждая ставка вносится человеком, прочитавшим решение маслихата. Пустая таблица честнее заполненной наугад."));
  } else {
    var estimated = payload.years[years[0]].coverage.estimated_total;
    coverage.appendChild(text("strong", "Таблица неполная: " + total + " из примерно " + estimated + " районов."));
    coverage.appendChild(text("p", "Отсутствие района в таблице не означает, что у него нет своей ставки. Это означает, что решение ещё не прочитано."));
  }

  var results = document.getElementById("results");
  var count = document.getElementById("count");

  function render(query) {
    var needle = query.trim().toLowerCase();
    var found = rows.filter(function (row) {
      if (!needle) { return true; }
      if (row.r.kato.indexOf(needle) === 0) { return true; }
      return (row.r.name_ru + " " + row.r.name_kk).toLowerCase().indexOf(needle) >= 0;
    });

    results.textContent = "";
    count.textContent = total === 0 ? "" : "Найдено: " + found.length + " из " + total;

    if (total === 0) { return; }
    if (found.length === 0) {
      results.appendChild(text("p", "Ничего не найдено. Возможно, решение по этому району ещё не внесено.", "empty"));
      return;
    }

    var table = document.createElement("table");
    var head = document.createElement("tr");
    ["КАТО", "Район", "Ставка", "Год", "Решение"].forEach(function (title) {
      head.appendChild(text("th", title));
    });
    table.appendChild(head);

    found.forEach(function (row) {
      var tr = document.createElement("tr");
      tr.appendChild(text("td", row.r.kato, "kato"));
      var name = document.createElement("td");
      name.appendChild(text("div", row.r.name_ru));
      name.appendChild(text("div", row.r.name_kk, "muted"));
      tr.appendChild(name);
      var rate = text("td", percent(row.r.rate), "rate");
      rate.appendChild(text("div", "база " + percent(row.base), "muted"));
      tr.appendChild(rate);
      tr.appendChild(text("td", row.year));

      var source = document.createElement("td");
      var link = document.createElement("a");
      link.href = row.r.source_url;
      link.textContent = row.r.decision_ref;
      link.rel = "noopener";
      source.appendChild(link);
      tr.appendChild(source);
      table.appendChild(tr);
    });
    results.appendChild(table);
  }

  var input = document.getElementById("q");
  input.addEventListener("input", function () { render(input.value); });
  render("");

  document.getElementById("meta").textContent =
    "Собрано: " + payload.generated_at +
    (payload.kato_version ? " · редакция КАТО: " + payload.kato_version : "") +
    " · схема " + payload.schema_version;
}());
</script>
</body>
</html>
