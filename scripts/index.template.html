<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--HEAD-->
<!--
  Generated by scripts/build.py. Do not edit dist/index.html, edit this template.

  The <title>, the description, the canonical link, the Open Graph tags, the
  favicon and both schema.org blocks are all emitted by render_head() in
  scripts/build.py, at the placeholder above. None of them is written here,
  because every one of them is derived: the title carries the years present, the
  description carries the district count, and the Dataset block carries both
  plus one distribution per published file. A copy kept here would be the copy
  that goes stale.

  Nothing in that head makes a request. The canonical link is a declaration, the
  favicon is a data: URI, and the two ld+json blocks are inline. A relative
  href to favicon.svg would have been a second HTTP request and would have
  broken the rule below, which is why it is inlined instead.

  One file, no framework, no request to anything. The dataset, the place-alias
  index and the search library are all inlined below, so the page works from
  file://, from Pages, and from a copy on a laptop with no network. Nothing
  loads, so nothing can fail halfway and leave a table that looks finished.

  The page never claims to be complete. A district that is absent has not had
  its decision read yet. It does not fall back to the base rate, and the
  coverage line says so in those words.

  An alias is a village, a rural okrug or a city borough with no decision of its
  own. It is never drawn as a row. It is drawn as a sentence naming the
  jurisdiction whose decision actually covers it.

  Several years are drawn side by side, oldest to newest, and only when the
  payload actually holds more than one. With one year the page has no year
  column and no hint that one exists, which is the state today. The current year
  is read from generated_at rather than the clock, so rebuilding old data
  produces the same page rather than a page that quietly re-ranks its columns.

  A year cell with no rate says «нет данных». It never falls back to the base
  rate: the district's decision for that year has not been read, which is not
  the same fact as the district having the base rate.
-->
<style>
  :root { color-scheme: light dark; --fg: #16181d; --bg: #fff; --muted: #5b6270; --line: #d9dde5; --accent: #0a58ca; --warn-bg: #fff6e5; --warn-line: #e0b34d; --tint-0: #e8f2ec; --tint-1: #e7eef8; --tint-2: #f4eee6; --tint-3: #f0ecf6; --cur-bg: #f4f7fc; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e8ec; --bg: #14161a; --muted: #9aa1ae; --line: #2c313a; --accent: #7aa7ff; --warn-bg: #2a2313; --warn-line: #6b5320; --tint-0: #1b2620; --tint-1: #1a2230; --tint-2: #2a241b; --tint-3: #241f2e; --cur-bg: #1a1f28; } }
  * { box-sizing: border-box; }
  body { margin: 0 auto; padding: 1rem 1rem 4rem; max-width: 54rem; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
  h1 { font-size: 1.3rem; line-height: 1.25; margin: 0 0 .35rem; }
  p { margin: .35rem 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  a { color: var(--accent); }

  .search { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: .5rem 0 .4rem; margin: .7rem 0 .2rem; border-bottom: 1px solid var(--line); }
  .search label { display: block; margin-bottom: .25rem; }
  input { width: 100%; padding: .7rem .8rem; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: .4rem; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  details.notice, details.coverage { margin: .5rem 0; font-size: .9rem; color: var(--muted); }
  details.coverage { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: .4rem; padding: .5rem .7rem; }
  summary { cursor: pointer; }
  details.notice summary strong, details.coverage summary strong { color: var(--fg); font-weight: 600; }
  details p { margin: .4rem 0; }

  .results { margin-top: .6rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  thead th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  tr.group th { position: sticky; top: 4.2rem; z-index: 3; background: var(--bg); font-size: .85rem; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--fg); border-bottom: 1px solid var(--line); }
  td.rate { width: 4.8rem; white-space: nowrap; }
  td.rate span.value { display: inline-block; min-width: 3.4rem; padding: .12rem .4rem; border-radius: .3rem; text-align: center; font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--tint-0); }
  td.rate span.t1 { background: var(--tint-1); }
  td.rate span.t2 { background: var(--tint-2); }
  td.rate span.t3 { background: var(--tint-3); }
  td.rate span.base { display: block; font-size: .75rem; color: var(--muted); }
  .kk { color: var(--muted); font-size: .9rem; }
  .kato { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; color: var(--muted); }
  td.decision { font-size: .85rem; }
  tr:target td { background: var(--warn-bg); }

  .alias { border-left: 3px solid var(--warn-line); background: var(--warn-bg); border-radius: .3rem; padding: .5rem .7rem; margin: .5rem 0; font-size: .95rem; }
  .alias p { margin: 0 0 .2rem; }
  .alias .kk, .alias .kato { display: block; }
  .empty { padding: 1.2rem 0; }
  /* The machine-readable files, stated on the page and not only in its
     metadata. They wrap rather than scroll: five file names at 390px do not fit
     on one line, and a horizontal scrollbar here would hide the last of them. */
  .files { display: flex; flex-wrap: wrap; gap: .15rem .5rem; }
  footer { margin-top: 2.5rem; border-top: 1px solid var(--line); padding-top: .8rem; color: var(--muted); font-size: .85rem; }
  footer .attribution { color: var(--fg); }

  /* Several years side by side. Every rule below is scoped to .multi-year or to
     a class only the multi-year renderer emits, so the one-year page cannot be
     reached by any of it. */
  body.multi-year { max-width: 66rem; }

  /* Fixed layout, so the place column keeps a readable width and the years
     split what is left evenly however many of them there are. Left to itself
     the browser gives the long decision reference all the room and squeezes
     each year down to one word per line. */
  table.multi { table-layout: fixed; }
  table.multi th.place-head { width: 26%; }
  thead th.yr { color: var(--muted); }
  thead th.yr.cur { color: var(--fg); font-weight: 700; }
  .cur-tag { display: block; font-size: .7rem; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
  th.yr.cur, td.yr.cur { background: var(--cur-bg); }
  td.yr { white-space: normal; }
  td.yr .value { display: inline-block; }
  /* The current year keeps the size and weight the single rate has today. Past
     and future years are legible and plainly secondary. */
  td.yr.past .value, td.yr.future .value { font-size: .95rem; font-weight: 600; background: none; border: 1px solid var(--line); color: var(--muted); }
  td.yr .decision { margin-top: .25rem; font-size: .78rem; overflow-wrap: break-word; }
  td.yr.past .decision a, td.yr.future .decision a { color: var(--muted); }
  td.yr .nodata { display: inline-block; font-size: .85rem; color: var(--muted); font-style: italic; }
  .ylabel { display: none; }

  @media (max-width: 640px) {
    .results { overflow-x: auto; }
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); }
    table, tbody, tr, td { display: block; }
    tbody tr.row { display: grid; grid-template-columns: 4.8rem minmax(0, 1fr); column-gap: .6rem; padding: .5rem 0; border-bottom: 1px solid var(--line); }
    tbody td { border: 0; padding: 0; }
    td.rate { grid-column: 1; grid-row: 1 / span 2; width: auto; }
    td.place { grid-column: 2; grid-row: 1; }
    td.decision { grid-column: 2; grid-row: 2; }
    tr.group { display: block; }
    tr.group th { display: block; top: 4.2rem; }

    /* One year per line rather than side by side: three columns of a decision
       reference at 390px is a horizontal scrollbar, and the phone is where most
       of this page is read. */
    body.multi-year { max-width: none; }
    tbody tr.mrow { display: block; padding: .55rem 0 .35rem; border-bottom: 1px solid var(--line); }
    tr.mrow td.place { display: block; margin-bottom: .4rem; }
    tr.mrow td.yr { display: block; width: auto; padding: .3rem .5rem; margin-bottom: .3rem; border-left: 3px solid var(--line); border-radius: .2rem; }
    tr.mrow td.yr.cur { border-left-color: var(--accent); }
    tr.mrow .ylabel { display: inline-block; min-width: 3rem; font-size: .8rem; color: var(--muted); }
    tr.mrow td.yr.cur .ylabel { color: var(--fg); font-weight: 600; }
  }
</style>
</head>
<body>
<h1 id="title"></h1>
<p class="muted">Ставка налога при специальном налоговом режиме на основе упрощённой декларации («упрощёнка»), с привязкой к коду КАТО. В каждой строке стоит ссылка на решение маслихата, из которого взята ставка.</p>
<p class="muted" id="baseline"></p>
<p class="muted files" id="files"></p>

<div class="search">
  <label for="q" class="muted">Поиск по коду КАТО или названию района</label>
  <input id="q" type="search" autocomplete="off" placeholder="750000000 или Алматы" aria-describedby="count">
</div>
<p class="muted" id="count" role="status"></p>

<details class="notice" id="notice"></details>
<details class="coverage" id="coverage"></details>
<details class="notice" id="disclosure"></details>

<div class="results" id="results"></div>

<footer id="footer"></footer>

<script type="application/json" id="payload">/*DATA*/</script>
<script type="application/json" id="aliases">/*ALIASES*/</script>
<script type="application/json" id="view">/*VIEW*/</script>
<script>/*MINISEARCH*/</script>
<script>
(function () {
  "use strict";
  var payload = JSON.parse(document.getElementById("payload").textContent);
  var aliasRows = JSON.parse(document.getElementById("aliases").textContent);
  // Which years there are, which one is current, and whether a future column
  // needs qualifying are all decided by the build, not here. See page_view() in
  // scripts/build.py.
  var view = JSON.parse(document.getElementById("view").textContent);
  var years = Object.keys(payload.years).sort().reverse();
  // Left to right on the page, oldest first. `years` stays newest-first because
  // the coverage line and the payload lookups below already read it that way.
  var yearsAsc = view.years;
  // The feature turns itself on with the data and is invisible until then.
  var multi = yearsAsc.length > 1;
  var currentYear = view.current_year;

  // One entry per district, holding every year we have for it. With one year in
  // the payload this is exactly the old one-entry-per-row list, in the same
  // order, which is what keeps the single-year page unchanged.
  var rows = [];
  var byKato = {};
  years.forEach(function (year) {
    payload.years[year].rates.forEach(function (rate) {
      var entry = byKato[rate.kato];
      if (!entry) {
        // Names come from the newest year that has the district, because that
        // is the newest reading of what the place is called.
        entry = { kato: rate.kato, base: payload.years[year].base_rate, r: rate, years: {}, bases: {} };
        byKato[rate.kato] = entry;
        rows.push(entry);
      }
      entry.years[year] = rate;
      entry.bases[year] = payload.years[year].base_rate;
    });
  });
  var total = rows.length;

  // The rate is stored as a fraction and shown as a percentage. Multiplying
  // floats gives 3.0000000000000004, so round to two decimals and trim. No
  // space before the sign: Kazakh accounting writes it closed up.
  function number(fraction) {
    return String(Math.round(fraction * 10000) / 100).replace(".", ",");
  }
  function percent(fraction) { return number(fraction) + "%"; }

  function text(tag, value, className) {
    var node = document.createElement(tag);
    node.textContent = value;
    if (className) { node.className = className; }
    return node;
  }

  function plural(n, forms) {
    var mod100 = n % 100;
    var mod10 = n % 10;
    if (mod100 >= 11 && mod100 <= 14) { return forms[2]; }
    if (mod10 === 1) { return forms[0]; }
    if (mod10 >= 2 && mod10 <= 4) { return forms[1]; }
    return forms[2];
  }

  // Kazakh letters are folded to their nearest Russian shape on BOTH sides of
  // the comparison. That is what lets «Конаев», typed on a Russian keyboard,
  // reach «Қонаев».
  var FOLD = { "ә": "а", "ғ": "г", "қ": "к", "ң": "н", "ө": "о", "ұ": "у", "ү": "у", "һ": "х", "і": "и", "ё": "е" };
  function fold(value) {
    return String(value).toLowerCase().replace(/[әғқңөұүһіё]/g, function (c) { return FOLD[c]; });
  }

  // The current year's base rate where we have that year, otherwise the newest
  // year's. Read from the payload either way; this page states no rate it was
  // not given.
  var base = payload.years[currentYear]
    ? payload.years[currentYear].base_rate
    : (rows.length ? rows[0].base : null);

  if (multi) {
    document.body.className = "multi-year";
    document.title = "Ставка налога по упрощённой декларации (упрощёнка) по районам Казахстана, " +
      yearsAsc.join(" · ") + " · КАТО";
  }

  document.getElementById("title").textContent =
    "Ставка налога по упрощённой декларации: районы и города" +
    (yearsAsc.length ? ", " + yearsAsc.join(" · ") : "");

  // The base rate is read out of the payload, never typed here. It is a rate,
  // and this page states no rate it was not given.
  if (base) {
    document.getElementById("baseline").textContent =
      "Общеустановленная ставка составляет " + percent(base) +
      ". Маслихат вправе понизить её не более чем на 50 %, поэтому по районам она отличается.";
  }

  // The machine-readable files, named on the page itself and not only in the
  // structured data, because the reader who wants the JSON should not have to
  // read the metadata to find out it exists.
  //
  // The list comes from the build (artefacts() in scripts/build.py), which is
  // the same list the schema.org distribution array and llms.txt are built
  // from. The links are relative, built here rather than written into the
  // template, so a copy opened from file:// still resolves them and the page
  // carries no static href to anything outside itself.
  var files = document.getElementById("files");
  files.appendChild(document.createTextNode("Машиночитаемые данные:"));
  view.files.forEach(function (entry) {
    var link = document.createElement("a");
    link.href = entry[1];
    link.textContent = entry[0];
    link.title = entry[2];
    files.appendChild(document.createTextNode(" "));
    files.appendChild(link);
  });

  // Read from the payload, never written into this template: the page and the
  // JSON must not be able to state different terms. The lead-in is stripped by
  // exact string match so the heading is not repeated inside the body.
  var LEAD = "Не является налоговой консультацией. ";
  var licence = "Лицензия " + payload.licence + " распространяется на этот набор данных и на скрипты. " +
    "Сами решения маслихатов ею не покрываются: официальные документы не являются объектами авторского права.";

  var notice = document.getElementById("notice");
  var noticeSummary = document.createElement("summary");
  noticeSummary.appendChild(text("strong", "Не является налоговой консультацией."));
  notice.appendChild(noticeSummary);
  notice.appendChild(text("p", payload.not_tax_advice_ru.replace(LEAD, "")));
  notice.appendChild(text("p", licence));

  // The honesty constraint (CHANGE 2): an absent district must never read as
  // "pays the base rate". If a decision lowering the rate exists but was not
  // found, that is unknown, not 4%.
  var coverageWarning = total === 0
    ? "Каждую ставку вносит человек, который прочитал решение маслихата. Пустая таблица честнее, чем заполненная наугад."
    : "Если района нет в таблице, для него не подтверждена сниженная ставка. Это не значит, что " +
      "там действует базовая ставка " + percent(base) + ": решение могло существовать и остаться " +
      "непрочитанным, а могло быть прочитано и не подтверждено (например, регулирует другой режим, " +
      "утратило силу, не удалось привязать к району). Ищите район выше: если для него есть " +
      "конкретная причина, страница покажет её; иначе ниже приведён полный список того, что " +
      "прочитано и почему.";
  var coverageHead = total === 0
    ? "В таблице пока нет ни одной ставки."
    : "Таблица неполная: " + total + " из примерно " +
      payload.years[years[0]].coverage.estimated_total + " районов и городов.";

  var coverage = document.getElementById("coverage");
  var coverageSummary = document.createElement("summary");
  coverageSummary.appendChild(text("strong", coverageHead));
  coverage.appendChild(coverageSummary);
  coverage.appendChild(text("p", coverageWarning));

  // The disclosure: every document the pipeline actually read and could not
  // turn into a row, grouped by the reason it gave for refusing, generated by
  // the build from its own output (grouped_refusals() in scripts/build.py).
  // Nothing here is hand-typed: the counts and the list change themselves
  // the day the pipeline reads a wider corpus.
  var disclosure = document.getElementById("disclosure");
  var refusals = view.refusals || [];
  var refusedTotal = refusals.reduce(function (sum, group) { return sum + group.count; }, 0);
  if (refusedTotal) {
    var disclosureSummary = document.createElement("summary");
    disclosureSummary.appendChild(text(
      "strong",
      "Прочитано, но не опубликовано: " + refusedTotal + " " +
        plural(refusedTotal, ["решение", "решения", "решений"])
    ));
    disclosure.appendChild(disclosureSummary);
    disclosure.appendChild(text(
      "p",
      "Каждое из этих решений программа прочитала и не смогла превратить в строку таблицы. " +
      "Ниже, для каждого, причина отказа, которую дал сам разбор, и ссылка на первоисточник."
    ));
    refusals.forEach(function (group) {
      var groupDetails = document.createElement("details");
      var groupSummary = document.createElement("summary");
      groupSummary.textContent = group.label_ru + " · " + group.count;
      groupDetails.appendChild(groupSummary);
      var list = document.createElement("ul");
      group.items.forEach(function (item) {
        var li = document.createElement("li");
        var link = document.createElement("a");
        link.href = item.source_url;
        link.textContent = item.document_id;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        li.appendChild(link);
        if (item.candidates && item.candidates.length) {
          li.appendChild(document.createTextNode(" · возможно: " + item.candidates.join(", ")));
        }
        list.appendChild(li);
      });
      groupDetails.appendChild(list);
      disclosure.appendChild(groupDetails);
    });
  } else {
    disclosure.parentNode.removeChild(disclosure);
  }

  // A future year's rate is not the same kind of fact as this year's, and the
  // page says so while a future column is on screen. The sentence itself comes
  // from the build; the page states no claim it was not given.
  if (view.future_note_ru) {
    // Created rather than filled in, so the one-year page carries no element
    // for it at all: the dormant page must be the page it is today, node for
    // node, not that page plus an empty hidden one.
    var slot = document.getElementById("results");
    slot.parentNode.insertBefore(text("p", view.future_note_ru, "muted future-note"), slot);
  }

  // Both notices again, in full, at the foot of the page. Findable twice, and a
  // wall of text in neither place.
  var footer = document.getElementById("footer");
  footer.appendChild(text("p", payload.not_tax_advice_ru));
  footer.appendChild(text("p", licence));
  footer.appendChild(text("p", coverageWarning));

  // Who made this and where the code is, said outright rather than left to be
  // inferred from the URL. The name, the repository and the sentence about how
  // the rates got here all come from the build: how many rows a person actually
  // verified is counted from the data, never asserted in this template.
  var attribution = document.createElement("p");
  attribution.className = "attribution";
  attribution.appendChild(document.createTextNode("Собрал " + view.author + ". Исходный код и данные: "));
  var repo = document.createElement("a");
  repo.href = view.repo_url;
  repo.textContent = view.repo_url.replace(/^https:\/\//, "");
  repo.target = "_blank";
  repo.rel = "noopener noreferrer";
  attribution.appendChild(repo);
  attribution.appendChild(document.createTextNode(". Лицензия " + payload.licence + "."));
  footer.appendChild(attribution);
  if (view.provenance_ru) { footer.appendChild(text("p", view.provenance_ru)); }

  function ruDate(stamp) {
    var m = String(stamp).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + "." + m[2] + "." + m[1] : String(stamp);
  }

  // A faint tint per distinct rate, paired with the number itself. The colour
  // is never the only carrier of the value.
  var tints = {};
  var everyRate = [];
  years.forEach(function (year) {
    payload.years[year].rates.forEach(function (rate) { everyRate.push(rate.rate); });
  });
  everyRate
    .filter(function (rate, i, all) { return all.indexOf(rate) === i; })
    .sort(function (a, b) { return a - b; })
    .forEach(function (rate, i) { tints[rate] = i % 4; });

  var index = null;
  if (typeof MiniSearch === "function") {
    index = new MiniSearch({
      fields: ["text"],
      storeFields: ["kind", "idx"],
      processTerm: function (term) { return fold(term); }
    });
    index.addAll(rows.map(function (row, i) {
      return {
        id: "r" + i,
        kind: "rate",
        idx: i,
        text: [row.r.kato, row.r.name_ru, row.r.name_kk, row.r.oblast_ru, row.r.oblast_kk].join(" ")
      };
    }));
    index.addAll(aliasRows.map(function (alias, i) {
      return { id: "a" + i, kind: "alias", idx: i, text: [alias[0], alias[1], alias[2]].join(" ") };
    }));
    // A district with no published rate is still searchable, so that looking
    // it up finds an honest answer instead of nothing. view.absent comes from
    // absent_districts() in scripts/build.py: every district-level КАТО code
    // with no row, minus none of them.
    index.addAll((view.absent || []).map(function (district, i) {
      return {
        id: "d" + i,
        kind: "absent",
        idx: i,
        text: [district.kato, district.name_ru, district.name_kk, district.oblast_ru, district.oblast_kk]
          .join(" ")
      };
    }));
  }

  // A word typed in the nominative must still reach the same word declined, and
  // «алматы» must reach «Алматинская область». Neither is a shared term, only a
  // shared prefix, so the query runs a second time truncated.
  function stem(query) {
    return query.split(/\s+/).map(function (token) {
      return token.length > 5 ? token.slice(0, Math.max(5, token.length - 3)) : token;
    }).join(" ");
  }

  function lookup(query) {
    var hits = [];
    var seen = {};
    if (!index) { return hits; }
    // Fuzziness on the typed query catches a typo. The truncated query is run
    // without it: truncating already loosens the match, and loosening a loose
    // query twice turned «Конаев» into a page of villages called Конай.
    //
    // A КАТО code is never fuzzy. One digit out is a different district, so a
    // near miss on 790000000 is not a helpful guess, it is a wrong answer. This
    // is also what keeps a permalink landing on one row.
    var digits = /^\d+$/.test(query.trim());
    var options = digits
      ? { prefix: true, combineWith: "AND" }
      : { prefix: true, fuzzy: 0.2, combineWith: "AND" };
    var queries = [[query, options]];
    var truncated = stem(query);
    if (truncated !== query) { queries.push([truncated, { prefix: true, combineWith: "AND" }]); }
    queries.forEach(function (candidate) {
      index.search(candidate[0], candidate[1]).forEach(function (hit) {
        if (seen[hit.id]) { return; }
        seen[hit.id] = true;
        hits.push(hit);
      });
    });
    return hits;
  }

  var results = document.getElementById("results");
  var count = document.getElementById("count");

  function rateCell(row) {
    var cell = document.createElement("td");
    cell.className = "rate";
    var value = text("span", percent(row.r.rate), "value");
    if (tints[row.r.rate]) { value.className = "value t" + tints[row.r.rate]; }
    cell.appendChild(value);
    // Marks the exception, not the rule: a district that did not lower the rate
    // at all. No row qualifies today. The day one does, it is labelled.
    if (row.r.rate === row.base) { cell.appendChild(text("span", "= база", "base")); }
    return cell;
  }

  function placeCell(row) {
    var place = document.createElement("td");
    place.className = "place";
    place.appendChild(text("div", row.r.name_ru));
    var kk = text("div", row.r.name_kk, "kk");
    kk.setAttribute("lang", "kk");
    place.appendChild(kk);
    place.appendChild(text("div", row.r.kato, "kato"));
    return place;
  }

  function rowNode(row) {
    var tr = document.createElement("tr");
    tr.className = "row";
    tr.id = "k" + row.r.kato;
    tr.appendChild(rateCell(row));
    tr.appendChild(placeCell(row));
    tr.appendChild(decisionCell(row.r, "td"));
    return tr;
  }

  function whenClass(year) {
    if (year === currentYear) { return "cur"; }
    return year > currentYear ? "future" : "past";
  }

  // One year of one district: its rate, whether that rate is the base one, and
  // its own citation, because each year is a different decision.
  function yearCell(row, year) {
    var cell = document.createElement("td");
    cell.className = "rate yr " + whenClass(year);
    cell.appendChild(text("span", year, "ylabel"));

    var rate = row.years[year];
    // No decision read for this district and year. The base rate is not the
    // answer to that, and neither is a blank cell that reads as one.
    if (!rate) {
      var missing = text("span", "нет данных", "nodata");
      missing.title = "Решение за " + year + " год по этому району ещё не прочитано";
      cell.appendChild(missing);
      return cell;
    }

    var value = text("span", percent(rate.rate), "value");
    if (tints[rate.rate]) { value.className = "value t" + tints[rate.rate]; }
    cell.appendChild(value);
    if (rate.rate === row.bases[year]) { cell.appendChild(text("span", "= база", "base")); }
    cell.appendChild(decisionCell(rate, "div"));
    return cell;
  }

  function multiRowNode(row) {
    var tr = document.createElement("tr");
    tr.className = "mrow";
    tr.id = "k" + row.r.kato;
    tr.appendChild(placeCell(row));
    yearsAsc.forEach(function (year) { tr.appendChild(yearCell(row, year)); });
    return tr;
  }

  function bodyRow(row) { return multi ? multiRowNode(row) : rowNode(row); }

  // Both links open in a new tab, so following a citation does not cost a
  // reader their place in a long table. rate.kazakh_source_url is the actual
  // Kazakh-language file the pipeline fetched and read to confirm this row,
  // not a guessed URL, so it is used directly rather than derived, and
  // data/rates.csv has one for every published row (validate.py checks it).
  // Each link is labelled in its own language: "Рус" for the Russian text,
  // "Қаз" for the Kazakh one.
  function decisionCell(rate, tag) {
    var cell = document.createElement(tag);
    cell.className = "decision";
    cell.appendChild(document.createTextNode(rate.decision_ref + " "));

    var ruLink = document.createElement("a");
    ruLink.href = rate.source_url;
    ruLink.textContent = "Рус";
    ruLink.title = "Текст решения на русском языке";
    ruLink.target = "_blank";
    ruLink.rel = "noopener noreferrer";
    cell.appendChild(ruLink);

    cell.appendChild(document.createTextNode(" "));

    var kkLink = document.createElement("a");
    kkLink.href = rate.kazakh_source_url;
    kkLink.textContent = "Қаз";
    kkLink.title = "Текст решения на казахском языке";
    kkLink.setAttribute("lang", "kk");
    kkLink.target = "_blank";
    kkLink.rel = "noopener noreferrer";
    cell.appendChild(kkLink);

    return cell;
  }

  function headRow() {
    var head = document.createElement("thead");
    var tr = document.createElement("tr");
    if (!multi) {
      ["Ставка", "Район или город", "Решение"].forEach(function (title) {
        tr.appendChild(text("th", title));
      });
      head.appendChild(tr);
      return head;
    }
    tr.appendChild(text("th", "Район или город", "place-head"));
    yearsAsc.forEach(function (year) {
      var th = text("th", year, "yr " + whenClass(year));
      if (year === currentYear) { th.appendChild(text("span", "текущий", "cur-tag")); }
      tr.appendChild(th);
    });
    head.appendChild(tr);
    return head;
  }

  // Display order only. data/rates.csv and dist/rates.json keep sorting by
  // КАТО, so no consumer's diff churns.
  //
  // Both tiers are derived from what the classifier already says, never from a
  // list of codes typed here. A city of republican significance is an oblast
  // level code (two digits, then seven zeros) whose Russian name starts «г.».
  // A city of oblast significance carries «Г.А.», городская администрация, in
  // its own name. Astana is absent from the dataset today; when its decision
  // parses it lands at 710000000 and sorts first with no change here.
  function tier(rate) {
    if (/^\d\d0000000$/.test(rate.kato) && /^г\./.test(rate.name_ru)) { return 0; }
    if (/Г\.А\.$/.test(rate.name_ru)) { return 1; }
    return 2;
  }

  function byTierThenKato(a, b) {
    return (tier(a.r) - tier(b.r)) || (a.r.kato < b.r.kato ? -1 : 1);
  }

  var CITIES = ["город", "города", "городов"];
  var DISTRICTS = ["район", "района", "районов"];

  // The band a group is summarised by is the current year's, so the headline
  // number is the one the reader is here for. Where no member has the current
  // year, every year we do hold is used rather than none.
  function bandRates(members) {
    if (!multi) { return members.map(function (row) { return row.r.rate; }); }
    var rates = [];
    members.forEach(function (row) {
      if (row.years[currentYear]) { rates.push(row.years[currentYear].rate); }
    });
    if (rates.length) { return rates; }
    members.forEach(function (row) {
      yearsAsc.forEach(function (year) {
        if (row.years[year]) { rates.push(row.years[year].rate); }
      });
    });
    return rates;
  }

  function groupRow(label, members, forms) {
    var rates = bandRates(members);
    var low = Math.min.apply(null, rates);
    var high = Math.max.apply(null, rates);
    var band = low === high ? percent(low) : "от " + percent(low) + " до " + percent(high);
    var tr = document.createElement("tr");
    tr.className = "group";
    var th = text("th", label + " · " + members.length + " " +
      plural(members.length, forms) + " · " + band);
    th.setAttribute("colspan", multi ? String(1 + yearsAsc.length) : "3");
    tr.appendChild(th);
    return tr;
  }

  function table(found, grouped) {
    var node = document.createElement("table");
    if (multi) { node.className = "multi"; }
    node.appendChild(headRow());
    var body = document.createElement("tbody");
    if (!grouped) {
      found.forEach(function (row) { body.appendChild(bodyRow(row)); });
      node.appendChild(body);
      return node;
    }

    // Астана, Алматы and Шымкент sit above the oblasts rather than at the
    // bottom of the code order, where nobody looking for the capital would
    // scroll to find them.
    var capitals = found.filter(function (row) { return tier(row.r) === 0; }).sort(byTierThenKato);
    if (capitals.length) {
      body.appendChild(groupRow("Города республиканского значения", capitals, CITIES));
      capitals.forEach(function (row) { body.appendChild(bodyRow(row)); });
    }

    var order = [];
    var groups = {};
    found.filter(function (row) { return tier(row.r) !== 0; }).forEach(function (row) {
      var key = row.r.oblast_ru || "";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(row);
    });
    order.forEach(function (key) {
      var members = groups[key].sort(byTierThenKato);
      if (key) { body.appendChild(groupRow(key, members, DISTRICTS)); }
      members.forEach(function (row) { body.appendChild(bodyRow(row)); });
    });
    node.appendChild(body);
    return node;
  }

  // An alias has no decision of its own, so it is never drawn as a row. It is
  // drawn as a sentence naming the jurisdiction whose decision covers it.
  function aliasNode(alias, target) {
    var node = document.createElement("div");
    node.className = "alias";
    // «Қонаев Г.А.» already ends in a full stop, and «Г.А.. Действует» is how a
    // generated sentence announces that nobody read it.
    var name = target.r.name_ru;
    var stop = name.slice(-1) === "." ? "" : ".";
    // With several years the sentence has to say which year it is quoting, and
    // it quotes the current one wherever we hold it.
    var shown = multi ? (target.years[currentYear] || null) : target.r;
    var shownYear = multi && shown ? currentYear : null;
    if (multi && !shown) {
      for (var y = yearsAsc.length - 1; y >= 0 && !shown; y -= 1) {
        if (target.years[yearsAsc[y]]) { shown = target.years[yearsAsc[y]]; shownYear = yearsAsc[y]; }
      }
    }
    node.appendChild(text(
      "p",
      alias[1] + " входит в " + name + stop + " Действует ставка " +
      name + (shownYear ? " на " + shownYear + " год" : "") + ": " + percent(shown.rate) + "."
    ));
    var kk = text("span", alias[2], "kk");
    kk.setAttribute("lang", "kk");
    node.appendChild(kk);
    node.appendChild(text("span", alias[0] + " → " + target.r.kato, "kato"));
    node.appendChild(decisionCell(shown, "div"));
    return node;
  }

  // A district with no published rate. The honesty constraint (CHANGE 2): a
  // reader must never be told "4%" as a fact for this row. When
  // district.attribution is non-empty it names the specific refused
  // document(s) view.absent's own build attached to this district; otherwise
  // the general, honest statement is shown and the reader is pointed at the
  // full disclosure below.
  function absentNode(district) {
    var node = document.createElement("div");
    node.className = "alias";
    node.id = "k" + district.kato;
    var head = district.name_ru + (district.oblast_ru ? " (" + district.oblast_ru + ")" : "");
    node.appendChild(text("p", head));
    var kk = text("span", district.name_kk, "kk");
    kk.setAttribute("lang", "kk");
    node.appendChild(kk);
    node.appendChild(text("span", district.kato, "kato"));

    if (district.attribution && district.attribution.length) {
      var shownReasons = {};
      district.attribution.forEach(function (item) {
        if (shownReasons[item.label_ru]) { return; }
        shownReasons[item.label_ru] = true;
        node.appendChild(text("p", item.label_ru + "."));
      });
      district.attribution.forEach(function (item) {
        var p = document.createElement("p");
        p.appendChild(document.createTextNode("Решение: "));
        var link = document.createElement("a");
        link.href = item.source_url;
        link.textContent = item.document_id;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        p.appendChild(link);
        node.appendChild(p);
      });
    } else {
      node.appendChild(text(
        "p",
        "Для этого района или города не найдено решение маслихата, понижающее ставку. Это не " +
        "значит, что здесь действует базовая ставка" + (base ? " " + percent(base) : "") +
        ": решение могло быть принято, но остаться непрочитанным или не пройти проверку. " +
        "Полный список того, что было прочитано и почему не опубликовано, приведён в разделе ниже."
      ));
    }
    return node;
  }

  var ALIAS_SHOWN = 12;
  var ABSENT_SHOWN = 12;

  function render(query) {
    var needle = query.trim();
    results.textContent = "";

    if (total === 0) {
      count.textContent = "";
      return;
    }

    if (!needle) {
      count.textContent = "Всего: " + total;
      results.appendChild(table(rows, true));
      return;
    }

    var found = [];
    var picked = {};
    var exact = [];
    var near = [];
    var absentExact = [];
    var absentNear = [];
    lookup(needle).forEach(function (hit) {
      if (hit.kind === "rate") {
        var row = rows[hit.idx];
        if (!picked[row.r.kato]) { picked[row.r.kato] = true; found.push(row); }
        return;
      }
      if (hit.kind === "absent") {
        var district = view.absent[hit.idx];
        var districtName = fold(district.name_ru) + " " + fold(district.name_kk);
        (districtName.indexOf(fold(needle)) >= 0 ? absentExact : absentNear).push(district);
        return;
      }
      var alias = aliasRows[hit.idx];
      var target = byKato[alias[3]];
      // No target row means no rate to state, and stating one anyway is exactly
      // the failure this project exists to prevent. The alias is dropped: its
      // jurisdiction has not been read, so the page has nothing to say about it.
      if (!target) { return; }
      var name = fold(alias[1]) + " " + fold(alias[2]);
      (name.indexOf(fold(needle)) >= 0 ? exact : near).push([alias, target]);
    });

    // Fuzziness earns its keep on a typo and not otherwise. «алматы» is one
    // letter from «Алмалы», and eleven villages called Алмалы standing above
    // the city is a worse answer than none of them. So a near miss is only
    // drawn when nothing matched outright.
    //
    // "Outright" means anywhere, not just among aliases. The rule read only its
    // own bucket until 2026-08-15, so «Жалагашский» drew three villages ending
    // «-гашский» above Жалагашский район itself: no ALIAS matched exactly, and
    // the district that did match exactly was in another bucket the rule could
    // not see. A near miss ranked above the word the reader actually typed.
    var matchedOutright = exact.length > 0 || absentExact.length > 0 || found.length > 0;
    var aliasHits = (exact.length ? exact : (matchedOutright ? [] : near)).slice(0, ALIAS_SHOWN);
    aliasHits.forEach(function (pair) {
      var target = pair[1];
      if (!picked[target.r.kato]) { picked[target.r.kato] = true; found.push(target); }
    });
    var absentHits = (absentExact.length ? absentExact : absentNear).slice(0, ABSENT_SHOWN);

    count.textContent = "Найдено: " + (found.length + absentHits.length);
    // A district the reader named exactly comes before an alias that only
    // resembles it. Aliases still lead when they are the exact match and the
    // district is the near one.
    if (absentExact.length) {
      absentHits.forEach(function (district) { results.appendChild(absentNode(district)); });
      aliasHits.forEach(function (pair) { results.appendChild(aliasNode(pair[0], pair[1])); });
    } else {
      aliasHits.forEach(function (pair) { results.appendChild(aliasNode(pair[0], pair[1])); });
      absentHits.forEach(function (district) { results.appendChild(absentNode(district)); });
    }

    if (found.length === 0 && aliasHits.length === 0 && absentHits.length === 0) {
      results.appendChild(text("p", "Ничего не найдено. Возможно, решение по этому району ещё не внесено или в запросе опечатка.", "empty"));
      return;
    }
    if (found.length) { results.appendChild(table(found, false)); }
  }

  var input = document.getElementById("q");
  input.addEventListener("input", function () { render(input.value); });

  // ?q=… drives the search box too, which is the only reason the page is
  // allowed to declare a schema.org SearchAction. Declaring one the page did
  // not honour would send every reader arriving from a search engine to the
  // unfiltered table and call it a result.
  //
  // No URLSearchParams: the rest of this file is ES5 on purpose, and one modern
  // API is how a page stops working on the browser someone actually has.
  function queryParam(name) {
    var found = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
    return found ? decodeURIComponent(found[1].replace(/\+/g, " ")) : "";
  }

  // A per-district permalink (#k750000000) opens the page already filtered to
  // that district, so a shared link lands on the row rather than near it. The
  // hash wins over ?q= when both are present: a permalink to one row is the
  // more specific of the two requests.
  var hash = decodeURIComponent(location.hash.replace(/^#k?/, ""));
  var initial = hash || queryParam("q");
  if (initial) { input.value = initial; }
  render(input.value);

  document.getElementById("footer").appendChild(text(
    "p",
    "Обновлено: " + ruDate(payload.generated_at) +
    (payload.kato_version ? " · редакция КАТО: " + payload.kato_version.replace("NK RK", "НК РК") : "") +
    " · версия схемы: " + payload.schema_version
  ));
}());
</script>
</body>
</html>
